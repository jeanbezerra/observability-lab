apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: headlamp
automountServiceAccountToken: true
---
# Cluster local de desenvolvimento: o backend do Headlamp usa esta identidade
# internamente para evitar OIDC e tokens manuais. O acesso externo é bloqueado
# pelo desenho: Service ClusterIP + port-forward preso a 127.0.0.1.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-local-admin
  labels:
    app.kubernetes.io/name: headlamp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp
    namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
      annotations:
        bootstrap.k8s.io/tls-checksum: __TLS_CHECKSUM__
        bootstrap.k8s.io/auth-mode: local-service-account
    spec:
      serviceAccountName: headlamp
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headlamp
          image: __HEADLAMP_IMAGE__
          imagePullPolicy: IfNotPresent
          command:
            - /headlamp/headlamp-server
          args:
            - -html-static-dir=/headlamp/frontend
            - -in-cluster
            - -in-cluster-context-name=kubernetes-wsl
            - -unsafe-use-service-account-token
            - -plugins-dir=/headlamp/plugins
            - -watch-plugins-changes=false
            - -tls-cert-path=/var/run/headlamp-tls/tls.crt
            - -tls-key-path=/var/run/headlamp-tls/tls.key
          ports:
            - name: https
              containerPort: 4466
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
          volumeMounts:
            - name: tls
              mountPath: /var/run/headlamp-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: headlamp-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: headlamp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - name: https
      appProtocol: https
      protocol: TCP
      port: 443
      targetPort: https
