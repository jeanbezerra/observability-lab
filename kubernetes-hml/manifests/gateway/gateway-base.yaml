# Este arquivo é um template renderizado por scripts/55-install-gateway.sh.
# Não aplique diretamente enquanto os marcadores __...__ estiverem presentes.
apiVersion: v1
kind: Namespace
metadata:
  name: __GATEWAY_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: kubernetes-hml
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: __ENVOY_PROXY_NAME__
  namespace: __ENVOY_GATEWAY_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: kubernetes-hml
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 1
        container:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      envoyService:
        # O controller mantém seu Service ClusterIP. A etapa 75 cria um Service
        # NodePort separado, com os mesmos selectors e a mesma porta de destino.
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: __GATEWAY_CLASS_NAME__
  labels:
    app.kubernetes.io/managed-by: kubernetes-hml
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: __ENVOY_PROXY_NAME__
    namespace: __ENVOY_GATEWAY_NAMESPACE__
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: __GATEWAY_NAME__
  namespace: __GATEWAY_NAMESPACE__
  labels:
    app.kubernetes.io/managed-by: kubernetes-hml
spec:
  gatewayClassName: __GATEWAY_CLASS_NAME__
  listeners:
    - name: http
      protocol: HTTP
      port: __GATEWAY_LISTENER_PORT__
      allowedRoutes:
        # Permite rotas de aplicações em qualquer namespace. Referências a um
        # backend em outro namespace ainda exigem um ReferenceGrant explícito.
        namespaces:
          from: All
